name: Construire et publier le musée

on:
  push:
    branches: [main]
  schedule:
    # Rafraîchit le catalogue chaque nuit : les dépôts bougent, le musée suit.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, mais on ne coupe pas une publication en
# cours : un déploiement Pages interrompu laisse le site dans un état bancal.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Les tests portent sur le code et les données versionnées (catalogue,
      # accrochage), jamais sur le catalogue régénéré la nuit même :
      # sinon un simple changement de topics/description d'un dépôt fait
      # bouger le clustering, casse des tests écrits contre les données
      # versionnées, et bloque tout le déploiement (#13). Un accrochage qui
      # échoue la nuit échoue toujours à son propre pas (`npm run accrocher`),
      # plus bas.
      - name: Vérifier
        run: |
          npm run lint
          npx vitest run

      # Les médias sont l'étape lente (un téléchargement par dépôt). On les
      # garde d'un build à l'autre ; build-media ne retélécharge que ce qui a
      # changé dans le catalogue.
      - name: Restaurer le cache des médias
        uses: actions/cache@v4
        with:
          path: public/media
          key: media-${{ runner.os }}-${{ hashFiles('public/data/catalogue.json') }}
          restore-keys: media-${{ runner.os }}-

      # Les matières PBR et l'HDRI : 35 Mo d'assets CC0 qui ne changent que
      # lorsque le manifeste de `fetch-assets.ts` change. La clé est le hachage
      # de l'outil lui-même : elle sur-invalide (un commentaire suffit) mais ne
      # sous-invalide jamais, ce qui est le bon sens de l'erreur pour un cache.
      - name: Restaurer le cache des assets CC0
        uses: actions/cache@v4
        with:
          path: |
            public/assets/materials
            public/assets/hdri
            public/assets/ciel
          key: assets-${{ runner.os }}-${{ hashFiles('tools/fetch-assets.ts') }}
          restore-keys: assets-${{ runner.os }}-

      # Sans cette étape, le musée se déployait en APLATS : pas une matière, pas
      # un grain, pas de terrazzo. Le pipeline la décrivait pourtant depuis le
      # premier jour — « la CI les récupère et les met en cache » — mais elle
      # n'avait jamais été branchée.
      - name: Récupérer les assets CC0
        run: node tools/fetch-assets.ts

      # Le catalogue du dernier build réussi sert de filet : si l'API GitHub
      # est en panne, on republie avec les données de la veille plutôt que de
      # casser le site.
      - name: Restaurer le dernier catalogue connu
        uses: actions/cache@v4
        with:
          path: public/data/catalogue.json
          key: catalogue-${{ github.run_id }}
          restore-keys: catalogue-

      - name: Récupérer les dépôts
        id: fetch
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch

      - name: Signaler la dégradation
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::Récupération GitHub en échec — publication avec le catalogue précédent."
          test -f public/data/catalogue.json || {
            echo "::error::Aucun catalogue de repli disponible, impossible de construire."
            exit 1
          }

      # L'architecture des projets phares, relevée dans leurs dépôts, pour les
      # ateliers en coupe. Jamais un blocage : en échec, le fichier versionné reste.
      - name: Relever les ateliers
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ateliers

      # Ce que le public VOIT d'un projet : la page de son site, photographiée par
      # le Chrome du runner, ou la première vraie image de son README. AVANT les
      # médias, qui en font les toiles. Sous `public/media/`, donc dans le cache
      # des médias ci-dessus : seuls les dépôts poussés depuis sont repris. Un
      # bonus, jamais un blocage : sans Chrome, les sites sont sautés.
      - name: Capturer les sites et les README
        continue-on-error: true
        run: npm run captures

      - name: Construire les médias
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run media

      # Le bâtiment est fixe (`src/plan/musee.ts`) : seuls les thèmes des salles
      # et les toiles sur leurs murs suivent le catalogue de la nuit.
      - name: Accrocher la collection
        run: npm run accrocher

      - name: Construire le site
        env:
          # phmatray.github.io/museum/ → le site n'est pas à la racine du domaine.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
